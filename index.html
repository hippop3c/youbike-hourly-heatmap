<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雙北 YouBike 分時熱力圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17324d;background:#eef4f7}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-rows:auto 1fr;height:100vh}.toolbar{background:#0b3954;color:#fff;padding:12px 16px;box-shadow:0 2px 8px #0003;z-index:1000}.title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.title-row h1{font-size:20px;margin:0}.status{font-size:13px;color:#cdeaf2}.controls{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px;align-items:end}.control{display:flex;flex-direction:column;gap:4px;position:relative}.control>label{font-size:12px;color:#cdeaf2}.multi summary,.control button{height:36px;border:1px solid #8ab7c5;border-radius:6px;background:#fff;color:#17324d;padding:8px 10px;cursor:pointer;list-style:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.multi summary::-webkit-details-marker{display:none}.multi summary:after{content:'▾';float:right}.multi[open] summary:after{content:'▴'}.options{position:absolute;top:40px;left:0;min-width:210px;max-height:260px;overflow:auto;background:#fff;color:#17324d;border:1px solid #8ab7c5;border-radius:8px;box-shadow:0 6px 20px #0004;padding:8px;z-index:1200}.options label{display:flex;align-items:center;gap:8px;padding:5px;border-radius:4px}.options label:hover{background:#e8f4f5}.option-actions{display:flex;gap:6px;position:sticky;top:-8px;background:#fff;padding:4px 0 7px}.option-actions button{height:28px;padding:2px 8px;border:1px solid #aacbd4;border-radius:4px;background:#eef7f8;color:#17324d}.hour-wrap{display:flex;align-items:center;gap:8px;height:36px}.hour-wrap input{min-width:80px;width:100%}.hour-value{min-width:52px;font-variant-numeric:tabular-nums;font-weight:700}.play{background:#f4a261!important;border-color:#f4a261!important;font-weight:700}.map-wrap{position:relative;min-height:0}#map{height:100%;width:100%}.legend{position:absolute;right:12px;bottom:28px;z-index:800;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 2px 12px #0003;min-width:205px}.legend-row{display:grid;grid-template-columns:58px 1fr 40px;gap:6px;align-items:center;font-size:12px;margin-top:6px}.gradient{height:10px;border-radius:5px}.warm{background:linear-gradient(90deg,#fff3b0,#f4a261,#d62828)}.cool{background:linear-gradient(90deg,#cfe8ff,#4ea8de,#3155a6)}.summary{position:absolute;left:12px;bottom:28px;z-index:800;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 2px 12px #0003;font-size:13px;min-width:210px}.summary-values{display:grid;grid-template-columns:auto auto;gap:3px 12px;margin-top:4px}.public-value{color:#d14900;font-weight:700}.dispatch-value{color:#3155a6;font-weight:700}.leaflet-popup-content{line-height:1.55}.popup-title{font-weight:700;font-size:15px}.popup-grid{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin-top:6px}.popup-grid span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}@media(max-width:980px){.controls{grid-template-columns:repeat(3,1fr)}.app{height:auto;min-height:100vh}.map-wrap{height:72vh}.title-row{align-items:flex-start;flex-direction:column}}@media(max-width:600px){.controls{grid-template-columns:1fr 1fr}.title-row h1{font-size:17px}.summary{left:8px;top:8px;bottom:auto}.legend{right:8px;bottom:12px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="title-row"><h1>雙北 YouBike 各站分時平均動態熱力圖</h1><div class="status" id="status"></div></div>
      <div class="controls">
        <div class="control"><label>日別（可複選）</label><details class="multi"><summary id="daySummary">平日</summary><div class="options" id="dayOptions"><label><input type="checkbox" value="平日" checked>平日</label><label><input type="checkbox" value="假日">假日</label></div></details></div>
        <div class="control"><label>城市（可複選）</label><details class="multi"><summary id="citySummary">台北市、新北市</summary><div class="options" id="cityOptions"><label><input type="checkbox" value="台北市" checked>台北市</label><label><input type="checkbox" value="新北市" checked>新北市</label></div></details></div>
        <div class="control"><label>行政區（可複選）</label><details class="multi"><summary id="districtSummary">全部行政區</summary><div class="options" id="districtOptions"></div></details></div>
        <div class="control"><label>指標（可複選）</label><details class="multi"><summary id="metricSummary">滿借、調出</summary><div class="options" id="metricOptions"></div></details></div>
        <div class="control"><label for="hour">小時</label><div class="hour-wrap"><input id="hour" type="range" min="0" max="23" step="1" value="8"><span class="hour-value" id="hourValue">08:00</span></div></div>
        <div class="control"><label>&nbsp;</label><button class="play" id="play" type="button">▶ 播放 24 小時</button></div>
      </div>
    </header>
    <section class="map-wrap">
      <div id="map" role="application" aria-label="雙北 YouBike 分時熱力圖"></div>
      <aside class="summary"><div id="selectionText"></div><div class="summary-values"><span>民眾行為</span><span class="public-value" id="publicTotal">0.00</span><span>調度行為</span><span class="dispatch-value" id="dispatchTotal">0.00</span></div><div>篩選站點每日平均次數合計</div></aside>
      <aside class="legend"><strong>熱區強度</strong><div class="legend-row"><span>民眾行為</span><div class="gradient warm"></div><span id="publicMax">0</span></div><div class="legend-row"><span>調度行為</span><div class="gradient cool"></div><span id="dispatchMax">0</span></div></aside>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="data.js"></script>
  <script>
  (() => {
    const D=window.YOUBIKE_HEATMAP_DATA, stations=D.stations, metrics=D.metrics;
    const publicMetrics=new Set(['滿借','空還']);
    const el=id=>document.getElementById(id), hour=el('hour');
    const map=L.map('map',{preferCanvas:true}).setView([25.06,121.54],11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
    const publicHeat=L.heatLayer([],{radius:25,blur:20,maxZoom:16,gradient:{.18:'#fff3b0',.55:'#f4a261',1:'#d62828'}}).addTo(map);
    const dispatchHeat=L.heatLayer([],{radius:22,blur:18,maxZoom:16,gradient:{.18:'#cfe8ff',.55:'#4ea8de',1:'#3155a6'}}).addTo(map);
    const markers=L.layerGroup().addTo(map);
    let timer=null;

    function checked(id){return [...document.querySelectorAll(`#${id} input[type=checkbox]:checked`)].map(x=>x.value)}
    function setSummary(id,values,allText){el(id).textContent=values.length===0?'未選擇':values.length>3?`${values.length}項已選`:values.join('、')||allText}
    function optionActions(container,onChange){const bar=document.createElement('div');bar.className='option-actions';for(const [text,value] of [['全選',true],['清除',false]]){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=()=>{container.querySelectorAll('input[type=checkbox]').forEach(x=>x.checked=value);onChange()};bar.appendChild(b)}container.prepend(bar)}
    function refreshDistricts(){const cities=checked('cityOptions'),box=el('districtOptions'),previous=new Set(checked('districtOptions'));box.innerHTML='';const values=[...new Set(stations.filter(s=>cities.length===0||cities.includes(s[1])).map(s=>s[2]))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));for(const value of values){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=value;input.checked=previous.size===0||previous.has(value);input.onchange=render;label.append(input,document.createTextNode(value));box.appendChild(label)}optionActions(box,render);updateLabels()}
    function updateLabels(){const days=checked('dayOptions'),cities=checked('cityOptions'),districts=checked('districtOptions'),selectedMetrics=checked('metricOptions');setSummary('daySummary',days,'全部日別');setSummary('citySummary',cities,'雙北全部');el('districtSummary').textContent=districts.length===0?'未選擇':districts.length===el('districtOptions').querySelectorAll('input[type=checkbox]').length?'全部行政區':districts.length>3?`${districts.length}區已選`:districts.join('、');setSummary('metricSummary',selectedMetrics,'全部指標')}
    function combinedRows(){const days=checked('dayOptions'),weights={平日:22,假日:7},totalDays=days.reduce((a,d)=>a+weights[d],0)||1,byStation=new Map();for(const d of days){for(const row of D.values[d][+hour.value]){let target=byStation.get(row[0]);if(!target){target=[0,0,0,0,0,0];byStation.set(row[0],target)}for(let i=0;i<6;i++)target[i]+=row[i+1]*weights[d]/totalDays}}return byStation}
    function percentile(values){const v=values.filter(x=>x>0).sort((a,b)=>a-b);return v.length?Math.max(.01,v[Math.min(v.length-1,Math.floor(v.length*.95))]):1}
    function render(){updateLabels();const cities=checked('cityOptions'),districts=checked('districtOptions'),selected=checked('metricOptions'),selectedPublic=selected.filter(x=>publicMetrics.has(x)),selectedDispatch=selected.filter(x=>!publicMetrics.has(x)),lookup=combinedRows();const rows=stations.map((s,i)=>{const vals=lookup.get(i)||[0,0,0,0,0,0],pub=selectedPublic.reduce((a,m)=>a+vals[metrics.indexOf(m)],0),dis=selectedDispatch.reduce((a,m)=>a+vals[metrics.indexOf(m)],0);return{s,i,vals,pub,dis}}).filter(x=>(cities.length===0||cities.includes(x.s[1]))&&(districts.length===0||districts.includes(x.s[2])));const pmax=percentile(rows.map(x=>x.pub)),dmax=percentile(rows.map(x=>x.dis));publicHeat.setLatLngs(rows.filter(x=>x.pub>0).map(x=>[x.s[3],x.s[4],Math.min(1,x.pub/pmax)]));dispatchHeat.setLatLngs(rows.filter(x=>x.dis>0).map(x=>[x.s[3],x.s[4],Math.min(1,x.dis/dmax)]));markers.clearLayers();for(const x of rows){if(x.pub>0)L.circleMarker([x.s[3],x.s[4]],{radius:Math.min(9,3+5*x.pub/pmax),color:'#d14900',weight:1,fillColor:'#f4a261',fillOpacity:.65}).bindPopup(popup(x)).addTo(markers);if(x.dis>0)L.circleMarker([x.s[3],x.s[4]],{radius:Math.min(7,2+4*x.dis/dmax),color:'#3155a6',weight:1,fillColor:'#4ea8de',fillOpacity:.65}).bindPopup(popup(x)).addTo(markers);if(x.pub===0&&x.dis===0)L.circleMarker([x.s[3],x.s[4]],{radius:2,color:'#708894',weight:1,fillOpacity:.15}).bindPopup(popup(x)).addTo(markers)}el('hourValue').textContent=String(+hour.value).padStart(2,'0')+':00';el('publicTotal').textContent=rows.reduce((a,x)=>a+x.pub,0).toFixed(2);el('dispatchTotal').textContent=rows.reduce((a,x)=>a+x.dis,0).toFixed(2);el('publicMax').textContent=pmax.toFixed(2);el('dispatchMax').textContent=dmax.toFixed(2);el('selectionText').textContent=`${checked('dayOptions').join('+')||'未選日別'}・${String(+hour.value).padStart(2,'0')}時・${rows.length.toLocaleString()}站`;el('status').textContent=`2026年7月｜${D.meta.matchedStations.toLocaleString()}站｜排除 7/10、7/11`}
    function popup(x){return `<div class="popup-title">${x.s[0]}</div><div>${x.s[1]}・${x.s[2]}・${String(+hour.value).padStart(2,'0')}:00</div><div class="popup-grid">${metrics.map((m,i)=>`<span>${m}</span><span>${x.vals[i].toFixed(2)}</span>`).join('')}</div>`}
    function stop(){if(timer){clearInterval(timer);timer=null;el('play').textContent='▶ 播放 24 小時'}}
    for(const m of metrics){const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.value=m;input.checked=m==='滿借'||m==='調出';input.onchange=render;label.append(input,document.createTextNode(m));el('metricOptions').appendChild(label)}
    optionActions(el('metricOptions'),render);
    document.querySelectorAll('#dayOptions input,#cityOptions input').forEach(x=>x.addEventListener('change',()=>{if(x.closest('#cityOptions'))refreshDistricts();render()}));
    hour.addEventListener('input',render);el('play').addEventListener('click',()=>{if(timer){stop();return}el('play').textContent='❚❚ 暫停';timer=setInterval(()=>{hour.value=(+hour.value+1)%24;render()},900)});
    refreshDistricts();render();
  })();
  </script>
</body>
</html>
