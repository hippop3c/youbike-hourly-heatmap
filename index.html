<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>雙北 YouBike 分時熱力圖</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17324d;background:#eef4f7}*{box-sizing:border-box}body{margin:0}.app{display:grid;grid-template-rows:auto 1fr;height:100vh}.toolbar{background:#0b3954;color:#fff;padding:12px 16px;box-shadow:0 2px 8px #0003;z-index:1000}.title-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:10px}.title-row h1{font-size:20px;margin:0}.status{font-size:13px;color:#cdeaf2}.controls{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;align-items:end}.control{display:flex;flex-direction:column;gap:4px}.control label{font-size:12px;color:#cdeaf2}.control select,.control input,.control button{height:36px;border:1px solid #8ab7c5;border-radius:6px;background:#fff;color:#17324d;padding:0 10px}.hour-wrap{display:flex;align-items:center;gap:8px}.hour-wrap input{padding:0;min-width:80px}.hour-value{min-width:52px;font-variant-numeric:tabular-nums;font-weight:700}.play{cursor:pointer;background:#f4a261!important;border-color:#f4a261!important;font-weight:700}.map-wrap{position:relative;min-height:0}#map{height:100%;width:100%}.legend{position:absolute;right:12px;bottom:28px;z-index:800;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 2px 12px #0003;min-width:170px}.legend-title{font-weight:700;margin-bottom:6px}.gradient{height:10px;border-radius:5px;background:linear-gradient(90deg,#2c7bb6,#abd9e9,#ffffbf,#fdae61,#d7191c)}.legend-scale{display:flex;justify-content:space-between;font-size:11px;color:#526879;margin-top:3px}.summary{position:absolute;left:12px;bottom:28px;z-index:800;background:#fff;padding:10px 12px;border-radius:8px;box-shadow:0 2px 12px #0003;font-size:13px}.summary strong{font-size:18px;color:#0b7189}.leaflet-popup-content{line-height:1.55}.popup-title{font-weight:700;font-size:15px}.popup-grid{display:grid;grid-template-columns:auto auto;gap:2px 12px;margin-top:6px}.popup-grid span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums}@media(max-width:900px){.controls{grid-template-columns:repeat(3,1fr)}.app{height:auto;min-height:100vh}.map-wrap{height:72vh}.title-row{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.controls{grid-template-columns:1fr 1fr}.legend{bottom:12px}.summary{left:8px;top:8px;bottom:auto}.title-row h1{font-size:17px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="title-row"><h1>雙北 YouBike 各站分時平均動態熱力圖</h1><div class="status" id="status"></div></div>
      <div class="controls">
        <div class="control"><label for="dayType">日別</label><select id="dayType"><option>平日</option><option>假日</option></select></div>
        <div class="control"><label for="city">城市</label><select id="city"><option value="all">雙北全部</option><option>台北市</option><option>新北市</option></select></div>
        <div class="control"><label for="district">行政區</label><select id="district"><option value="all">全部行政區</option></select></div>
        <div class="control"><label for="metric">觀察指標</label><select id="metric"></select></div>
        <div class="control"><label for="hour">小時</label><div class="hour-wrap"><input id="hour" type="range" min="0" max="23" step="1" value="8"><span class="hour-value" id="hourValue">08:00</span></div></div>
        <div class="control"><label>&nbsp;</label><button class="play" id="play" type="button">▶ 播放 24 小時</button></div>
      </div>
    </header>
    <section class="map-wrap">
      <div id="map" role="application" aria-label="雙北 YouBike 分時熱力圖"></div>
      <aside class="summary"><div id="selectionText"></div><strong id="totalValue">0.00</strong><div>篩選站點平均次數合計</div></aside>
      <aside class="legend"><div class="legend-title" id="legendTitle">滿借</div><div class="gradient"></div><div class="legend-scale"><span>低</span><span id="legendMax">高</span></div></aside>
    </section>
  </main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="data.js"></script>
  <script>
    (()=>{
      const D=window.YOUBIKE_HEATMAP_DATA, stations=D.stations, metrics=D.metrics;
      const el=id=>document.getElementById(id), day=el('dayType'),city=el('city'),district=el('district'),metric=el('metric'),hour=el('hour');
      metrics.forEach(m=>metric.add(new Option(m,m)));
      const map=L.map('map',{preferCanvas:true}).setView([25.06,121.54],11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
      let heat=L.heatLayer([],{radius:24,blur:19,maxZoom:16,gradient:{0.15:'#2c7bb6',0.4:'#abd9e9',0.6:'#ffffbf',0.8:'#fdae61',1:'#d7191c'}}).addTo(map);
      let markers=L.layerGroup().addTo(map), timer=null;
      const metricIndex=()=>metrics.indexOf(metric.value);
      function updateDistricts(){const selected=city.value,current=district.value;const list=[...new Set(stations.filter(s=>selected==='all'||s[1]===selected).map(s=>s[2]))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));district.innerHTML='<option value="all">全部行政區</option>';list.forEach(x=>district.add(new Option(x,x)));if(list.includes(current))district.value=current;}
      function currentValues(){const sparse=D.values[day.value][+hour.value],idx=metricIndex(),lookup=new Map(sparse.map(r=>[r[0],r]));const rows=stations.map((s,i)=>({s,i,v:(lookup.get(i)||[])[idx+1]||0})).filter(x=>(city.value==='all'||x.s[1]===city.value)&&(district.value==='all'||x.s[2]===district.value));return{rows,lookup};}
      function render(){const state=currentValues(),rows=state.rows,lookup=state.lookup,positive=rows.map(x=>x.v).filter(v=>v>0).sort((a,b)=>a-b),p95=positive.length?positive[Math.min(positive.length-1,Math.floor(positive.length*.95))]:1,max=Math.max(p95,.01);heat.setLatLngs(rows.filter(x=>x.v>0).map(x=>[x.s[3],x.s[4],Math.min(1,x.v/max)]));markers.clearLayers();rows.forEach(x=>{const color=x.v>0?'#087e8b':'#708894';const radius=x.v>0?Math.min(9,3+5*x.v/max):2;const all=lookup.get(x.i)||[x.i,0,0,0,0,0,0];L.circleMarker([x.s[3],x.s[4]],{radius,color,weight:1,fillColor:color,fillOpacity:x.v>0?.72:.18}).bindPopup(`<div class="popup-title">${x.s[0]}</div><div>${x.s[1]}・${x.s[2]}・${String(+hour.value).padStart(2,'0')}:00</div><div class="popup-grid">${metrics.map((m,i)=>`<span>${m}</span><span>${(+all[i+1]).toFixed(2)}</span>`).join('')}</div>`).addTo(markers)});const total=rows.reduce((a,x)=>a+x.v,0);el('hourValue').textContent=String(+hour.value).padStart(2,'0')+':00';el('legendTitle').textContent=metric.value+'每日平均';el('legendMax').textContent=max.toFixed(2);el('totalValue').textContent=total.toFixed(2);el('selectionText').textContent=`${day.value}・${city.options[city.selectedIndex].text}・${district.options[district.selectedIndex].text}・${String(+hour.value).padStart(2,'0')}時`;el('status').textContent=`2026年7月｜${D.meta.matchedStations.toLocaleString()}站｜排除 7/10、7/11`;}
      function stop(){if(timer){clearInterval(timer);timer=null;el('play').textContent='▶ 播放 24 小時';}}
      el('play').addEventListener('click',()=>{if(timer){stop();return}el('play').textContent='❚❚ 暫停';timer=setInterval(()=>{hour.value=(+hour.value+1)%24;render()},900)});
      [day,metric,hour].forEach(x=>x.addEventListener('input',render));city.addEventListener('change',()=>{updateDistricts();district.value='all';render()});district.addEventListener('change',render);
      updateDistricts();render();
    })();
  </script>
</body>
</html>
